<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#D50000" />
  <title>Prépa ALIX 🔴⚪</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Prépa ALIX" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23D50000'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='900'>A</text></svg>" />

  <!-- Styles Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Résolution des modules React / lucide via CDN -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom": "https://esm.sh/react-dom@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.2.0"
    }
  }
  </script>

  <!-- Babel : transforme le JSX directement dans le navigateur -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    html, body, #root { height: 100%; }
    body { margin: 0; background: #F4F4F5; -webkit-tap-highlight-color: transparent;
           font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #D50000; font-size: 15px; font-weight: 700; }
    /* pas de sélection intempestive sur les steppers */
    button { -webkit-user-select: none; user-select: none; }
  </style>
</head>
<body>
  <div id="root"><div id="boot">Chargement…</div></div>

  <!-- L'application (JSX, compilée à la volée par Babel) -->
  <script type="text/babel" data-type="module" data-presets="react" src="./app.jsx"></script>
</body>
</html>
